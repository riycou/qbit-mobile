<svg xmlns="http://www.w3.org/2000/svg" width="1180" height="720" viewBox="0 0 1180 720" role="img" aria-labelledby="title desc">
  <title id="title">qBit Mobile desktop advanced options</title>
  <desc id="desc">Desktop qBit Mobile advanced options page with qBittorrent preference cards and orange dark theme.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1a0d03"/>
      <stop offset=".36" stop-color="#050505"/>
      <stop offset="1" stop-color="#050505"/>
    </linearGradient>
    <linearGradient id="orange" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ff9d2e"/>
      <stop offset="1" stop-color="#ff7a14"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="18" stdDeviation="24" flood-color="#000" flood-opacity=".38"/>
    </filter>
    <style>
      text{font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif}
      .white{fill:#f6f2ee}.muted{fill:#a09a93}.soft{fill:#6f6861}.orange{fill:#ff8a1f}.panel{fill:#101010}.panel2{fill:#161616}
      .label{font-size:11px;font-weight:850;letter-spacing:.18em}.small{font-size:13px}.body{font-size:15px}.h1{font-size:42px;font-weight:850}.h2{font-size:22px;font-weight:850}.bold{font-weight:800}
    </style>
  </defs>
  <rect width="1180" height="720" rx="28" fill="url(#bg)"/>
  <circle cx="1045" cy="-10" r="210" fill="#ff8a1f" opacity=".08"/>
  <g transform="translate(0 0)">
    <rect width="1180" height="78" fill="#050505" opacity=".88"/>
    <line x1="0" y1="78" x2="1180" y2="78" stroke="#2a2a2a"/>
    <rect x="28" y="15" width="48" height="48" rx="15" fill="url(#orange)"/>
    <path d="M52 27v20m0 0l-8-8m8 8l8-8" stroke="#1c0b00" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="92" y="38" class="white" font-size="19" font-weight="850">qBit Mobile</text>
    <text x="92" y="58" class="muted small">Live server</text>
    <g transform="translate(448 0)">
      <text x="0" y="48" class="muted body">Dashboard</text>
      <text x="118" y="48" class="muted body">Torrents</text>
      <text x="220" y="48" class="muted body">RSS</text>
      <text x="296" y="48" class="orange body bold">Advanced</text>
      <line x1="296" y1="77" x2="370" y2="77" stroke="#ff8a1f" stroke-width="3"/>
    </g>
    <rect x="1060" y="16" width="44" height="44" rx="14" class="panel" stroke="#2a2a2a"/>
    <path d="M1075 38h14m-7-7v14" stroke="#f6f2ee" stroke-width="2.5" stroke-linecap="round"/>
    <rect x="1114" y="16" width="44" height="44" rx="14" class="panel" stroke="#2a2a2a"/>
    <path d="M1127 37h18M1136 28v18" stroke="#f6f2ee" stroke-width="2.5" stroke-linecap="round"/>
  </g>

  <g transform="translate(28 112)">
    <text x="0" y="0" class="orange label">ADVANCED</text>
    <text x="0" y="48" class="white h1">Native WebUI controls</text>
    <rect x="0" y="78" width="1124" height="86" rx="22" fill="#17100a" stroke="#2a2a2a"/>
    <text x="24" y="114" class="white h2">qBittorrent preferences, without leaving the PWA</text>
    <text x="24" y="142" class="muted body">Queueing, connection limits, speed behavior, categories, RSS, logs, and appearance stay backed by qBittorrent's own API.</text>
    <rect x="856" y="98" width="112" height="42" rx="14" fill="#201207" stroke="#704019"/>
    <text x="884" y="124" class="orange small bold">Reload</text>
    <rect x="982" y="98" width="118" height="42" rx="14" fill="url(#orange)"/>
    <text x="1012" y="124" fill="#1c0b00" class="small bold">Save</text>
  </g>

  <g transform="translate(28 310)">
    <rect width="356" height="160" rx="22" class="panel" stroke="#2a2a2a" filter="url(#shadow)"/>
    <text x="24" y="38" class="orange label">QUEUE</text>
    <text x="24" y="74" class="white h2">Unlimited torrents</text>
    <text x="24" y="104" class="muted body">Disable queueing and remove active torrent limits.</text>
    <rect x="24" y="122" width="134" height="28" rx="9" fill="#ff8a1f" opacity=".14"/>
    <text x="40" y="141" class="orange small bold">Preset available</text>
  </g>

  <g transform="translate(412 310)">
    <rect width="356" height="160" rx="22" class="panel" stroke="#2a2a2a" filter="url(#shadow)"/>
    <text x="24" y="38" class="orange label">CONNECTIONS</text>
    <text x="24" y="74" class="white h2">Unlimited connections</text>
    <text x="24" y="104" class="muted body">Set global and per-torrent limits from the API.</text>
    <rect x="24" y="122" width="134" height="28" rx="9" fill="#ff8a1f" opacity=".14"/>
    <text x="40" y="141" class="orange small bold">Preset available</text>
  </g>

  <g transform="translate(796 310)">
    <rect width="356" height="160" rx="22" class="panel" stroke="#2a2a2a" filter="url(#shadow)"/>
    <text x="24" y="38" class="orange label">DIAGNOSTICS</text>
    <text x="24" y="74" class="white h2">Logs &amp; Problems</text>
    <text x="24" y="104" class="muted body">Connection, RSS, and torrent-state events are visible.</text>
    <rect x="24" y="122" width="92" height="28" rx="9" fill="#42c978" opacity=".14"/>
    <text x="42" y="141" fill="#42c978" class="small bold">Healthy</text>
  </g>

  <g transform="translate(28 506)">
    <rect width="1124" height="154" rx="22" class="panel" stroke="#2a2a2a"/>
    <text x="24" y="38" class="orange label">APPEARANCE</text>
    <text x="24" y="74" class="white h2">Light, dark, system, and eight accents</text>
    <text x="24" y="104" class="muted body">Orange remains the default. Settings are local to the device and do not store qBittorrent passwords.</text>
    <g transform="translate(750 44)">
      <circle cx="0" cy="0" r="15" fill="#ff8a1f"/>
      <circle cx="42" cy="0" r="15" fill="#4c9cff"/>
      <circle cx="84" cy="0" r="15" fill="#21c7dc"/>
      <circle cx="126" cy="0" r="15" fill="#42c978"/>
      <circle cx="168" cy="0" r="15" fill="#a879ff"/>
      <circle cx="210" cy="0" r="15" fill="#f46fb2"/>
      <circle cx="252" cy="0" r="15" fill="#f05b63"/>
      <circle cx="294" cy="0" r="15" fill="#f6ba36"/>
    </g>
  </g>
</svg>
