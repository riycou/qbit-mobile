<svg xmlns="http://www.w3.org/2000/svg" width="390" height="844" viewBox="0 0 390 844" role="img" aria-labelledby="title desc">
  <title id="title">qBit Mobile torrent queue on a phone</title>
  <desc id="desc">Dark mobile torrent queue UI with orange accent, search, torrent cards, and bottom navigation.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#160c03"/>
      <stop offset="0.42" stop-color="#050505"/>
      <stop offset="1" stop-color="#050505"/>
    </linearGradient>
    <linearGradient id="orange" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ff9d2e"/>
      <stop offset="1" stop-color="#ff7a14"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="14" stdDeviation="18" flood-color="#000" flood-opacity="0.45"/>
    </filter>
    <style>
      text{font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif}
      .muted{fill:#a09a93}.soft{fill:#6f6861}.line{stroke:#2a2a2a}.panel{fill:#101010}.panel2{fill:#161616}
      .white{fill:#f6f2ee}.orange{fill:#ff8a1f}.label{font-size:10px;font-weight:800;letter-spacing:.17em}.tiny{font-size:11px}.small{font-size:13px}.body{font-size:15px}.h1{font-size:34px;font-weight:850}.h2{font-size:24px;font-weight:850}.bold{font-weight:800}
    </style>
  </defs>
  <rect width="390" height="844" rx="36" fill="url(#bg)"/>
  <circle cx="330" cy="24" r="92" fill="#ff8a1f" opacity=".08"/>
  <text x="24" y="42" class="white" font-size="20" font-weight="800">9:41</text>
  <rect x="315" y="27" width="36" height="16" rx="5" fill="#f6f2ee"/>
  <rect x="351" y="31" width="3" height="8" rx="1.5" fill="#f6f2ee"/>
  <rect x="319" y="31" width="25" height="8" rx="2" fill="#050505"/>

  <g transform="translate(20 76)">
    <rect width="48" height="48" rx="15" fill="url(#orange)"/>
    <path d="M24 13v20m0 0l-8-8m8 8l8-8" fill="none" stroke="#1c0b00" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="64" y="21" class="white" font-size="18" font-weight="850">qBit Mobile</text>
    <text x="64" y="42" class="muted" font-size="13">Live server</text>
    <rect x="302" y="1" width="48" height="48" rx="15" fill="#101010" stroke="#2a2a2a"/>
    <path d="M326 14v20m10-10h-20" stroke="#f6f2ee" stroke-width="3" stroke-linecap="round"/>
  </g>

  <g transform="translate(20 154)">
    <text x="0" y="0" class="orange label">DOWNLOAD SPEED</text>
    <text x="0" y="48" class="white h1">4.8 MB/s</text>
    <text x="0" y="77" class="orange body">↓ 2 active downloads</text>
    <rect x="230" y="-24" width="140" height="72" rx="18" class="panel" stroke="#2a2a2a"/>
    <text x="248" y="3" class="muted tiny">Upload</text>
    <text x="248" y="28" class="white body bold">830 KB/s</text>
    <text x="248" y="55" class="soft tiny">Free disk 1.8 TB</text>
  </g>

  <line x1="0" y1="266" x2="390" y2="266" stroke="#2a2a2a"/>

  <g transform="translate(20 310)">
    <text x="0" y="0" class="orange label">QUEUE</text>
    <text x="0" y="46" class="white h1">All torrents</text>
    <rect x="302" y="-16" width="58" height="58" rx="19" fill="url(#orange)" filter="url(#shadow)"/>
    <path d="M331 0v26m13-13h-26" stroke="#1c0b00" stroke-width="3" stroke-linecap="round"/>
  </g>

  <g transform="translate(20 388)">
    <rect width="306" height="54" rx="17" fill="#101010" stroke="#2a2a2a"/>
    <circle cx="25" cy="27" r="8" fill="none" stroke="#a09a93" stroke-width="2.5"/>
    <path d="M31 33l7 7" stroke="#a09a93" stroke-width="2.5" stroke-linecap="round"/>
    <text x="54" y="33" class="muted body">Search torrents</text>
    <rect x="336" width="54" height="54" rx="17" fill="#101010" stroke="#2a2a2a"/>
    <path d="M352 18h22M352 36h22M358 13v10M368 31v10" stroke="#f6f2ee" stroke-width="2.2" stroke-linecap="round"/>
  </g>

  <g transform="translate(20 466)">
    <rect width="350" height="114" rx="20" class="panel" stroke="#2a2a2a"/>
    <circle cx="40" cy="57" r="28" fill="#ff8a1f" opacity=".10"/>
    <path d="M35 47v20M45 47v20" stroke="#ff8a1f" stroke-width="3" stroke-linecap="round"/>
    <text x="84" y="35" class="white body bold">Ubuntu Desktop 24.04 LTS</text>
    <rect x="84" y="56" width="220" height="5" rx="2.5" fill="#233638"/>
    <rect x="84" y="56" width="151" height="5" rx="2.5" fill="#ff8a1f"/>
    <rect x="84" y="74" width="62" height="24" rx="8" fill="#ff8a1f" opacity=".14"/>
    <text x="97" y="91" class="orange small">Active</text>
    <text x="156" y="91" class="muted small">68% of 5.9 GB</text>
    <text x="268" y="91" class="muted small">4.2 MB/s</text>
    <path d="M326 47l10 10-10 10" fill="none" stroke="#f6f2ee" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <g transform="translate(20 596)">
    <rect width="350" height="114" rx="20" class="panel" stroke="#2a2a2a"/>
    <circle cx="40" cy="57" r="28" fill="#ff8a1f" opacity=".10"/>
    <path d="M35 47v20M45 47v20" stroke="#ff8a1f" stroke-width="3" stroke-linecap="round"/>
    <text x="84" y="35" class="white body bold">Debian Netinst ISO</text>
    <rect x="84" y="56" width="220" height="5" rx="2.5" fill="#233638"/>
    <rect x="84" y="56" width="220" height="5" rx="2.5" fill="#42c978"/>
    <rect x="84" y="74" width="78" height="24" rx="8" fill="#42c978" opacity=".14"/>
    <text x="96" y="91" fill="#42c978" class="small">Complete</text>
    <text x="172" y="91" class="muted small">100% of 740 MB</text>
    <text x="282" y="91" class="muted small">Seeding</text>
    <path d="M326 47l10 10-10 10" fill="none" stroke="#f6f2ee" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <g transform="translate(0 760)">
    <rect width="390" height="84" fill="#080808" opacity=".96"/>
    <line x1="0" y1="0" x2="390" y2="0" stroke="#2a2a2a"/>
    <g transform="translate(70 20)">
      <path d="M14 0v18m0 0l-7-7m7 7l7-7M4 28h20" stroke="#ff8a1f" stroke-width="2.2" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="-9" y="46" class="orange tiny">Torrents</text>
    </g>
    <rect x="166" y="14" width="58" height="58" rx="19" fill="url(#orange)" filter="url(#shadow)"/>
    <path d="M195 30v26m13-13h-26" stroke="#1c0b00" stroke-width="3" stroke-linecap="round"/>
    <g transform="translate(300 22)">
      <path d="M3 12a19 19 0 0 1 19 19M3 4a27 27 0 0 1 27 27M4 28h.01" stroke="#a09a93" stroke-width="2.6" fill="none" stroke-linecap="round"/>
      <text x="-3" y="44" class="muted tiny">RSS</text>
    </g>
  </g>
</svg>
