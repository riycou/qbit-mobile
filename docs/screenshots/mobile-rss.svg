    <rect x="18" y="48" width="42" height="42" rx="14" fill="#ff8a1f" opacity=".14"/>
    <path d="M31 70a10 10 0 0 1 10 10M31 60a20 20 0 0 1 20 20M31 79h.01" stroke="#ff8a1f" stroke-width="2.4" fill="none" stroke-linecap="round"/>
    <text x="76" y="34" class="muted small">Ubuntu Releases · 4 min ago</text>
    <text x="76" y="60" class="white body bold">Ubuntu 24.04.5 Desktop ISO</text>
    <text x="76" y="82" class="white body bold">official torrent</text>
    <text x="76" y="112" class="muted small">Torrent · Unread</text>
    <rect x="294" y="54" width="42" height="42" rx="14" fill="#201207" stroke="#704019"/>
    <path d="M315 63v18m0 0l-7-7m7 7l7-7M306 88h18" stroke="#ff8a1f" stroke-width="2.2" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <g transform="translate(20 610)">
    <rect width="350" height="138" rx="20" class="panel" stroke="#2a2a2a"/>
    <rect x="18" y="48" width="42" height="42" rx="14" fill="#ff8a1f" opacity=".14"/>
    <path d="M31 70a10 10 0 0 1 10 10M31 60a20 20 0 0 1 20 20M31 79h.01" stroke="#ff8a1f" stroke-width="2.4" fill="none" stroke-linecap="round"/>
    <text x="76" y="34" class="muted small">Debian News · 21 min ago</text>
    <text x="76" y="60" class="white body bold">Debian netinst amd64 torrent</text>
    <text x="76" y="82" class="white body bold">available for download</text>
    <text x="76" y="112" class="muted small">740 MB · Unread</text>
    <rect x="294" y="54" width="42" height="42" rx="14" fill="#201207" stroke="#704019"/>
    <path d="M315 63v18m0 0l-7-7m7 7l7-7M306 88h18" stroke="#ff8a1f" stroke-width="2.2" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <g transform="translate(0 760)">
    <rect width="390" height="84" fill="#080808" opacity=".96"/>
    <line x1="0" y1="0" x2="390" y2="0" stroke="#2a2a2a"/>
    <g transform="translate(70 20)" opacity=".65">
