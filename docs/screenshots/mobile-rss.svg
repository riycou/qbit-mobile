    <text x="82" y="28" class="soft small">48</text>
    <rect x="140" width="124" height="46" rx="14" fill="#201207" stroke="#704019"/>
    <circle cx="160" cy="23" r="4" fill="#ff8a1f"/>
    <text x="174" y="28" class="white body">Unread</text>
    <text x="236" y="28" class="muted small">3</text>
