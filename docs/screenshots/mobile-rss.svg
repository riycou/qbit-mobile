    <text x="80" y="58" class="muted body">3 unread items</text>
    <rect x="294" y="20" width="42" height="42" rx="14" fill="#101010" stroke="#2a2a2a"/>
    <path d="M315 31v5h5M320 38a8 8 0 1 1-2-7" fill="none" stroke="#f6f2ee" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

